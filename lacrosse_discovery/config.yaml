---
name: LaCrosse MQTT Bridge
version: "2.0.1"
slug: lacrosse_discovery
description: >-
  Finds a JeeLink running the LaCrosseITPlusReader sketch, listens for
  LaCrosse/Technoline sensor packets, and publishes them to Home Assistant
  via MQTT Discovery so they show up as normal, fully UI-manageable
  entities. Auto-discovers and remembers the JeeLink's serial port.
url: https://github.com/sinise/lacrosse-addons
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
uart: true
services:
  - mqtt:want
options:
  autodiscover_ports: true
  mqtt_enabled: true
  discovery_prefix: "homeassistant"
  expire_after: 1800
schema:
  com_port: str?
  autodiscover_ports: bool
  mqtt_enabled: bool
  discovery_prefix: str
  expire_after: int(60,86400)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
