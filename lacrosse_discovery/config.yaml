---
name: LaCrosse Discovery
version: "1.0.0"
slug: lacrosse_discovery
description: >-
  Scans every serial port for a JeeLink running the LaCrosseITPlusReader
  sketch, listens for LaCrosse/Technoline sensor packets and generates a
  ready-to-paste `sensor: - platform: lacrosse` configuration block.
url: https://github.com/sinise/lacrosse-addons
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: mdi:thermometer-lines
panel_title: LaCrosse Discovery
full_access: true
map:
  - addon_config:rw
options:
  scan_duration: 60
schema:
  scan_duration: int(10,600)
